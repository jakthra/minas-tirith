networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Allow repo webhooks to reach local services (event listener):
      # private ranges plus the rootless-podman host-mapping address.
      - FORGEJO__webhook__ALLOWED_HOST_LIST=private,169.254.0.0/16
    restart: always
    networks:
      - forgejo
    volumes:
      - ./forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '3000:3000'
      - '2222:22'
